name: Build & Deploy to Google Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play Track to deploy to'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      version_code:
        description: 'Custom Version Code (leave blank to use gradle default or auto)'
        required: false
        default: ''
      version_name:
        description: 'Custom Version Name (e.g. 1.7, leave blank for default)'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  deploy:
    name: Build & Upload Release Bundle
    runs-on: ubuntu-latest
    env:
      PLAY_STORE_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Decode Release Keystore
        id: decode_keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Build Signed Android App Bundle (AAB)
        env:
          KEYSTORE_PATH: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Save Signed AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.tangledline.game
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Set up Python for Metadata Sync
        if: env.PLAY_STORE_KEY != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Libraries
        if: env.PLAY_STORE_KEY != ''
        run: pip install google-api-python-client google-auth

      - name: Update Play Store Listing (ASO Metadata)
        if: env.PLAY_STORE_KEY != ''
        continue-on-error: true
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
          PACKAGE_NAME: com.tangledline.game
        run: python scripts/update-playstore-listing.py



