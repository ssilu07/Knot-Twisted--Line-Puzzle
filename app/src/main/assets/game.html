<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Knot Twisted</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Nunito',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)}
canvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#top-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;pointer-events:auto;flex-wrap:wrap;gap:8px}
#level-badge{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;font-family:'Fredoka One',cursive;font-size:16px;padding:6px 16px;border-radius:30px;box-shadow:0 4px 15px rgba(238,90,36,0.4);transition:transform 0.3s}
#moves-badge, #timer-badge, #total-stars{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);color:#fff;font-weight:700;font-size:14px;padding:6px 14px;border-radius:30px;border:1px solid rgba(255,255,255,0.2);transition:transform 0.2s}
#timer-badge{display:none;color:#feca57}
#total-stars{color:#feca57;font-weight:800;cursor:pointer}
#cross-badge{background:rgba(255,100,100,0.25);backdrop-filter:blur(10px);color:#ff6b6b;font-weight:800;font-size:14px;padding:6px 14px;border-radius:30px;border:1px solid rgba(255,100,100,0.3);position:absolute;top:65px;right:20px;pointer-events:none;transition:transform 0.2s,opacity 0.3s}
#bottom-bar{position:absolute;bottom:30px;left:0;width:100%;display:flex;justify-content:center;gap:12px;pointer-events:auto;padding:0 16px}
.btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;font-family:'Fredoka One',cursive;font-size:14px;padding:11px 22px;border-radius:30px;cursor:pointer;box-shadow:0 4px 20px rgba(102,126,234,0.4);transition:transform 0.15s,box-shadow 0.15s}
.btn:active{transform:scale(0.92)}
.btn.reset{background:linear-gradient(135deg,#f093fb,#f5576c);box-shadow:0 4px 20px rgba(245,87,108,0.4)}
.btn.hint{background:linear-gradient(135deg,#feca57,#ff9f43);box-shadow:0 4px 20px rgba(254,202,87,0.4);color:#333}
.btn.sound{background:linear-gradient(135deg,#1dd1a1,#10ac84);box-shadow:0 4px 20px rgba(29,209,161,0.4);font-size:18px;padding:11px 16px}
.btn.menu{background:linear-gradient(135deg,#54a0ff,#2e86de);box-shadow:0 4px 20px rgba(84,160,255,0.4);font-size:18px;padding:11px 16px}
.btn:disabled{opacity:0.4}
#hint-count{font-size:12px;font-weight:800}

.screen-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,12,41,0.9);backdrop-filter:blur(8px);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:20;pointer-events:auto;transition:opacity 0.3s}
.screen-overlay.show{display:flex}
.screen-overlay h1{font-family:'Fredoka One',cursive;font-size:42px;background:linear-gradient(135deg,#f093fb,#f5576c,#feca57,#48dbfb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.screen-overlay p{color:rgba(255,255,255,0.7);font-size:16px;font-weight:700;margin-bottom:30px}

/* Start Screen */
#start-screen{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);z-index:30}
#start-screen .sub{color:rgba(255,255,255,0.5);font-size:14px;font-weight:700;margin-bottom:12px;letter-spacing:2px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;width:90%;max-width:320px}
.mode-btn{padding:14px;border-radius:15px;border:none;font-family:'Nunito',sans-serif;font-weight:800;color:white;cursor:pointer;transition:transform 0.1s}
.mode-btn:active{transform:scale(0.95)}
.mode-classic{background:linear-gradient(135deg,#667eea,#764ba2)}
.mode-time{background:linear-gradient(135deg,#ff6b6b,#ee5a24)}
.mode-zen{background:linear-gradient(135deg,#1dd1a1,#10ac84)}
.mode-daily{background:linear-gradient(135deg,#feca57,#ff9f43);color:#333}
.main-actions{display:flex;gap:12px;margin-top:10px}
.action-btn{padding:12px 20px;border-radius:20px;border:none;font-weight:800;color:white;background:rgba(255,255,255,0.1);backdrop-filter:blur(5px);cursor:pointer}

/* Win Screen */
#win-screen h1{animation:titlePop 0.6s ease-out}
@keyframes titlePop{0%{transform:scale(0) rotate(-10deg);opacity:0}60%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes badgeBump{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
#stars-row{display:flex;gap:8px;margin-bottom:20px}
#stars-row span{font-size:40px;opacity:0;transform:scale(0)}

/* Shop Screen */
.shop-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:15px;width:90%;max-width:350px;margin-bottom:20px;max-height:50vh;overflow-y:auto;padding:10px}
.shop-item{background:rgba(255,255,255,0.1);border-radius:15px;padding:15px 5px;text-align:center;color:white;font-weight:700;border:2px solid transparent;cursor:pointer}
.shop-item.owned{border-color:rgba(255,255,255,0.3)}
.shop-item.equipped{border-color:#1dd1a1;background:rgba(29,209,161,0.2)}
.shop-icon{font-size:32px;margin-bottom:5px}

/* Levels Map Screen */
.levels-header{text-align:center;margin-bottom:8px}
.levels-header h1{margin-bottom:2px;font-size:32px}
.levels-stats{display:flex;justify-content:center;gap:16px;color:#feca57;font-weight:800;font-size:13px;margin-bottom:8px}
.chapter-nav{display:flex;align-items:center;justify-content:space-between;width:92%;max-width:360px;margin-bottom:8px;background:rgba(255,255,255,0.08);padding:8px 12px;border-radius:16px;backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,0.12)}
.nav-arrow{background:rgba(255,255,255,0.18);border:none;color:white;font-size:16px;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s,background 0.15s}
.nav-arrow:active{transform:scale(0.9)}
.chapter-info{text-align:center;flex:1;margin:0 8px}
.chapter-title{font-family:'Fredoka One',cursive;font-size:15px;color:#fff}
.chapter-sub{font-size:12px;color:rgba(255,255,255,0.7);font-weight:700;margin-top:2px}
.jump-btn{background:rgba(254,202,87,0.18);border:1px solid rgba(254,202,87,0.4);color:#feca57;font-weight:800;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;margin-bottom:8px;transition:transform 0.1s}
.jump-btn:active{transform:scale(0.95)}
.level-grid{display:grid;grid-template-columns:repeat(5, 1fr);gap:8px;width:92%;max-width:360px;margin-bottom:12px;max-height:44vh;overflow-y:auto;padding:6px 4px}
.level-item{background:rgba(255,255,255,0.1);border-radius:12px;padding:8px 2px;text-align:center;color:white;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid transparent;transition:transform 0.15s, background 0.2s}
.level-item:active{transform:scale(0.93)}
.level-item .lvl-num{font-size:14px;line-height:1.1}
.level-item .lvl-stars{font-size:9px;color:#feca57;margin-top:2px;min-height:12px;letter-spacing:-1px}
.level-item.locked{opacity:0.35;background:rgba(0,0,0,0.3);cursor:not-allowed}
.level-item.completed{background:linear-gradient(135deg,rgba(29,209,161,0.35),rgba(16,172,132,0.5));border-color:rgba(29,209,161,0.5)}
.level-item.current{border:2px solid #feca57;box-shadow:0 0 12px rgba(254,202,87,0.6);animation:badgeBump 1.2s infinite ease-in-out}

.emoji-deco{font-size:60px;margin-bottom:20px;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-12px) rotate(-5deg)}50%{transform:translateY(-18px) rotate(0)}75%{transform:translateY(-12px) rotate(5deg)}}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
#confetti-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:19}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="confetti-canvas"></canvas>
<div id="ui-overlay">
  <div id="top-bar">
    <div id="level-badge">Level 1</div>
    <div id="moves-badge">Moves: 0</div>
    <div id="timer-badge">⏳ 60s</div>
    <div id="total-stars" onclick="openShop()">⭐ 0</div>
  </div>
  <div id="cross-badge">Crossings: 0</div>
  <div id="bottom-bar">
    <button class="btn menu" onclick="goHome()">🏠</button>
    <button class="btn reset" onclick="resetLevel()">🔄</button>
    <button class="btn hint" id="hint-btn" onclick="useHint()">💡 <span id="hint-count">(2)</span></button>
    <button class="btn sound" id="sound-btn" onclick="toggleSound()">🔊</button>
  </div>
</div>

<div id="win-screen" class="screen-overlay">
  <div id="stars-row"><span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
  <h1 id="win-title">Untangled!</h1>
  <p id="win-msg">Solved in 0 moves</p>
  <div id="win-chapter-banner" style="display:none; color:#feca57; font-family:'Fredoka One',cursive; font-size:16px; margin-bottom:15px; text-align:center;"></div>
  <button class="btn" id="next-lvl-btn" onclick="nextLevel()" style="font-size:18px;padding:14px 40px;">Next Level ▶</button>
  <button class="btn reset" id="retry-btn" onclick="resetLevel(); document.getElementById('win-screen').classList.remove('show');" style="display:none; font-size:18px;padding:14px 40px; margin-top:10px;">Retry</button>
</div>

<div id="shop-screen" class="screen-overlay">
  <h1>Shop</h1>
  <p>Customize your nodes</p>
  <div class="shop-grid" id="shop-grid"></div>
  <button class="btn" onclick="closeShop()" style="font-size:18px;padding:14px 40px;">Back</button>
</div>

<div id="levels-screen" class="screen-overlay">
  <div class="levels-header">
    <h1>1000+ Levels</h1>
    <div class="levels-stats">
      <span id="levels-total-stars">⭐ 0</span>
      <span id="levels-progress-txt">Progress: 1 / 1000+</span>
    </div>
  </div>
  <div class="chapter-nav">
    <button class="nav-arrow" id="prev-chapter-btn" onclick="changeChapter(-1)">◀</button>
    <div class="chapter-info">
      <div class="chapter-title" id="chapter-title">Chapter 1: Novice Tangles</div>
      <div class="chapter-sub" id="chapter-sub">Levels 1 - 50 • ⭐ 0 / 150</div>
    </div>
    <button class="nav-arrow" id="next-chapter-btn" onclick="changeChapter(1)">▶</button>
  </div>
  <button class="jump-btn" onclick="jumpToCurrentLevel()">🎯 Jump to My Level</button>
  <div class="level-grid" id="level-grid"></div>
  <button class="btn" onclick="closeLevels()" style="font-size:16px;padding:12px 36px;">Back</button>
</div>

<div id="start-screen" class="screen-overlay show">
  <div class="emoji-deco">🪢</div>
  <h1>Knot Twisted</h1>
  <p class="sub">1000+ PUZZLES • 20 CHAPTERS</p>
  
  <div class="mode-grid">
    <button class="mode-btn mode-classic" onclick="startGame('classic')">CLASSIC (1000+)</button>
    <button class="mode-btn mode-time" onclick="startGame('timeattack')">TIME ATTACK</button>
    <button class="mode-btn mode-zen" onclick="startGame('zen')">ZEN MODE</button>
    <button class="mode-btn mode-daily" onclick="startGame('daily')">DAILY PUZZLE</button>
  </div>
  
  <div class="main-actions">
    <button class="action-btn" onclick="openShop()">🛒 Shop</button>
    <button class="action-btn" onclick="openLevels()">🗺️ 1000+ Levels</button>
  </div>
</div>

<script>
// ==================== STATE ====================
let gameMode = 'classic'; // classic, timeattack, zen, daily
let totalStars = 0;
let unlockedLevels = 1;
let levelStars = {};
let equippedSkin = 'default';
let currentChapterView = 1;

const CHAPTERS = [
  { id: 1, name: "Novice Tangles", icon: "🌱", color: "#2ecc71" },
  { id: 2, name: "Twisted Apprentice", icon: "⚡", color: "#f1c40f" },
  { id: 3, name: "Rope Weaver", icon: "🧶", color: "#e67e22" },
  { id: 4, name: "Geometric Maze", icon: "🔷", color: "#3498db" },
  { id: 5, name: "Knot Explorer", icon: "🧭", color: "#9b59b6" },
  { id: 6, name: "String Artisan", icon: "🎨", color: "#e84393" },
  { id: 7, name: "Tangle Tactician", icon: "⚔️", color: "#00cec9" },
  { id: 8, name: "Web Master", icon: "🕸️", color: "#16a085" },
  { id: 9, name: "Vibrant Vortex", icon: "🌀", color: "#fd79a8" },
  { id: 10, name: "Labyrinth Lord", icon: "🏰", color: "#d63031" },
  { id: 11, name: "Crystal Cord", icon: "💎", color: "#74b9ff" },
  { id: 12, name: "Mythic Strands", icon: "🦄", color: "#a29bfe" },
  { id: 13, name: "Nexus Knight", icon: "🛡️", color: "#0984e3" },
  { id: 14, name: "Quantum Knot", icon: "⚛️", color: "#6c5ce7" },
  { id: 15, name: "Zenith Master", icon: "🏔️", color: "#00b894" },
  { id: 16, name: "Cosmic Weave", icon: "🌌", color: "#6c5ce7" },
  { id: 17, name: "Dimensional Net", icon: "🌐", color: "#00cec9" },
  { id: 18, name: "Infinite Loom", icon: "🪢", color: "#fab1a0" },
  { id: 19, name: "Celestial Knot", icon: "✨", color: "#ffeaa7" },
  { id: 20, name: "Grandmaster Knot", icon: "👑", color: "#ff7675" }
];

let skins = {
  'default': { icon: '⭕', price: 0, owned: true },
  'gem': { icon: '💎', price: 10, owned: false },
  'star': { icon: '⭐', price: 25, owned: false },
  'heart': { icon: '❤️', price: 50, owned: false },
  'fire': { icon: '🔥', price: 100, owned: false },
  'alien': { icon: '👽', price: 150, owned: false }
};

function loadState() {
  try {
    totalStars = parseInt(localStorage.getItem('kt_stars')) || 0;
    unlockedLevels = parseInt(localStorage.getItem('kt_unlocked')) || 1;
    let savedStars = JSON.parse(localStorage.getItem('kt_level_stars'));
    if(savedStars && typeof savedStars === 'object') {
      levelStars = savedStars;
    }
    let savedSkins = JSON.parse(localStorage.getItem('kt_skins'));
    if(savedSkins) {
      for(let k in skins) if(savedSkins[k]) skins[k].owned = true;
    }
    equippedSkin = localStorage.getItem('kt_equipped') || 'default';
    let pLvl = parseInt(localStorage.getItem('knotTwistedLevel'));
    if(pLvl && pLvl > unlockedLevels) unlockedLevels = pLvl; // legacy migration
    
    // Android Bridge override
    if(window.AndroidBridge){
      let bridgeLvl = AndroidBridge.getSavedLevel();
      if(bridgeLvl > unlockedLevels) unlockedLevels = bridgeLvl;
    }
  } catch(e) {}
  document.getElementById('total-stars').textContent = '⭐ ' + totalStars;
}

function saveState() {
  try {
    localStorage.setItem('kt_stars', totalStars);
    localStorage.setItem('kt_unlocked', unlockedLevels);
    localStorage.setItem('kt_level_stars', JSON.stringify(levelStars));
    let s = {}; for(let k in skins) s[k] = skins[k].owned;
    localStorage.setItem('kt_skins', JSON.stringify(s));
    localStorage.setItem('kt_equipped', equippedSkin);
    if(window.AndroidBridge) AndroidBridge.saveLevel(unlockedLevels);
  } catch(e) {}
  document.getElementById('total-stars').textContent = '⭐ ' + totalStars;
}

// ==================== SOUND & HAPTICS ====================
let audioCtx=null,soundOn=true;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function playTone(freq,dur,type='sine',vol=0.15){
  if(!soundOn||!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function sndPickup(){playTone(520,0.08,'sine',0.12);playTone(660,0.08,'sine',0.08); hapticVibrate(15);}
function sndDrop(){playTone(440,0.1,'triangle',0.1); hapticVibrate(10);}
function sndUncross(){playTone(880,0.15,'sine',0.1);setTimeout(()=>playTone(1100,0.12,'sine',0.08),80); hapticVibrate(30);}
function sndHint(){playTone(600,0.1,'sine',0.1);setTimeout(()=>playTone(750,0.1,'sine',0.1),100);setTimeout(()=>playTone(900,0.15,'sine',0.1),200);}
function sndWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.25,'sine',0.12),i*120)); hapticVibrate(100);}
function sndClick(){playTone(700,0.05,'square',0.06); hapticVibrate(10);}
function sndReset(){playTone(400,0.12,'sawtooth',0.06);setTimeout(()=>playTone(300,0.15,'sawtooth',0.06),80);}
function toggleSound(){initAudio();soundOn=!soundOn;document.getElementById('sound-btn').textContent=soundOn?'🔊':'🔇';if(soundOn)sndClick();}

function hapticVibrate(ms) {
    if(window.AndroidBridge && window.AndroidBridge.vibrate) {
        window.AndroidBridge.vibrate(ms);
    } else if(navigator.vibrate) {
        navigator.vibrate(ms);
    }
}

// ==================== PARTICLES & CONFETTI ====================
let particles=[];
function spawnParticles(x,y,color,count=6){if(particles.length>60)return;for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3,color,alpha:1,life:0.6+Math.random()*0.4,age:0});}}
function spawnRingParticles(x,y,color){for(let i=0;i<12;i++){const a=(Math.PI*2*i)/12;particles.push({x,y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,r:2,color,alpha:1,life:0.5,age:0,ring:true});}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.age+=dt;p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.alpha=1-p.age/p.life;if(p.ring){p.r+=0.3;p.vx*=0.96;p.vy*=0.96;}if(p.age>=p.life)particles.splice(i,1);}}
function drawParticles(){for(const p of particles){ctx.globalAlpha=Math.max(0,p.alpha);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();}ctx.globalAlpha=1;}

const confettiCanvas=document.getElementById('confetti-canvas');
const cctx=confettiCanvas.getContext('2d');
let confetti=[],confettiActive=false;
function resizeConfetti(){confettiCanvas.width=W*dpr;confettiCanvas.height=H*dpr;confettiCanvas.style.width=W+'px';confettiCanvas.style.height=H+'px';cctx.setTransform(dpr,0,0,dpr,0,0);}
function launchConfetti(){confetti=[];confettiActive=true;const cols=['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#1dd1a1','#f368e0','#ff9f43','#54a0ff'];for(let i=0;i<40;i++){confetti.push({x:W/2+((Math.random()-0.5)*W*0.3),y:H+10,vx:(Math.random()-0.5)*6,vy:-(8+Math.random()*8),r:3+Math.random()*5,color:cols[Math.floor(Math.random()*cols.length)],rot:Math.random()*360,rotSpeed:(Math.random()-0.5)*10,alpha:1,shape:Math.random()>0.5?'rect':'circle'});}}
function updateConfetti(){if(!confettiActive)return;cctx.clearRect(0,0,W,H);let alive=0;for(const c of confetti){c.x+=c.vx;c.y+=c.vy;c.vy+=0.18;c.rot+=c.rotSpeed;c.vx*=0.99;c.alpha-=0.005;if(c.alpha<=0)continue;alive++;cctx.save();cctx.globalAlpha=Math.max(0,c.alpha);cctx.translate(c.x,c.y);cctx.rotate(c.rot*Math.PI/180);cctx.fillStyle=c.color;if(c.shape==='rect')cctx.fillRect(-c.r/2,-c.r*1.5,c.r,c.r*3);else{cctx.beginPath();cctx.arc(0,0,c.r,0,Math.PI*2);cctx.fill();}cctx.restore();}if(alive===0){confettiActive=false;cctx.clearRect(0,0,W,H);}}

let bgStars=[];
function initBgStars(){bgStars=[];for(let i=0;i<40;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,r:0.5+Math.random()*1.5,ts:0.5+Math.random()*2,ph:Math.random()*Math.PI*2});}
function drawBgStars(t){for(const s of bgStars){const a=0.2+0.3*Math.sin(t*s.ts+s.ph);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.fill();}}

// ==================== GAME ENGINE ====================
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W,H,dpr;
let nodes=[],edges=[],solvedPositions=[],currentShape='circle';
let dragNode=null,dragTargetX=0,dragTargetY=0,untangleBounce=0,moves=0,level=1,solved=false,hintsLeft=2,hintNode=null;
let prevCrossings=0,nodeScales={};
let gameTime=0,lastFrame=0,previewUntil=0;
let timeRemaining = 0;
const COLORS=['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#1dd1a1','#f368e0','#ff9f43','#54a0ff','#5f27cd','#01a3a4','#ee5a24','#c44569','#6c5ce7','#00cec9','#e17055','#fdcb6e'];

function polyPt(verts,t){const p=t*verts.length;const i=Math.floor(p)%verts.length,f=p-i;const a=verts[i],b=verts[(i+1)%verts.length];return{x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f};}
const SHAPES={
  circle:t=>{const a=2*Math.PI*t-Math.PI/2;return{x:Math.cos(a),y:Math.sin(a)};},
  triangle:t=>polyPt([[0,-1],[0.87,0.5],[-0.87,0.5]],t),
  square:t=>polyPt([[-1,-1],[1,-1],[1,1],[-1,1]],t),
  diamond:t=>polyPt([[0,-1],[1,0],[0,1],[-1,0]],t),
  hexagon:t=>{const verts=[];for(let k=0;k<6;k++){const ang=(k/6)*2*Math.PI-Math.PI/2;verts.push([Math.cos(ang),Math.sin(ang)]);}return polyPt(verts,t);},
  heart:t=>{const a=2*Math.PI*t;const x=16*Math.pow(Math.sin(a),3);const y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));return{x:x/17,y:y/17};},
  star:t=>{const verts=[];for(let k=0;k<10;k++){const r=k%2===0?1:0.45;const ang=(k/10)*2*Math.PI-Math.PI/2;verts.push([r*Math.cos(ang),r*Math.sin(ang)]);}return polyPt(verts,t);},
  house:t=>polyPt([[0,-1],[1,-0.3],[1,1],[-1,1],[-1,-0.3]],t),
  arrow:t=>polyPt([[-1,-0.4],[0.2,-0.4],[0.2,-0.85],[1,0],[0.2,0.85],[0.2,0.4],[-1,0.4]],t),
  cat:t=>polyPt([[-0.7,-1],[-0.4,-0.4],[0.4,-0.4],[0.7,-1],[0.9,-0.3],[1,0.3],[0.6,0.9],[-0.6,0.9],[-1,0.3],[-0.9,-0.3]],t),
  fish:t=>polyPt([[-1,-0.55],[-0.3,-0.15],[-0.3,0.15],[-1,0.55],[-0.2,0.55],[0.5,0.6],[1,0.0],[0.5,-0.6],[-0.2,-0.55]],t),
  butterfly:t=>polyPt([[0,-0.3],[0.3,-0.9],[1,-0.7],[1,-0.1],[0.4,-0.05],[1,0.1],[1,0.75],[0.3,0.5],[0,0.55],[-0.3,0.5],[-1,0.75],[-1,0.1],[-0.4,-0.05],[-1,-0.1],[-1,-0.7],[-0.3,-0.9]],t),
  flower:t=>polyPt([[0,-1],[0.35,-0.3],[0.95,-0.3],[0.58,0.2],[0.58,0.95],[0,0.35],[-0.58,0.95],[-0.58,0.2],[-0.95,-0.3],[-0.35,-0.3]],t),
  tree:t=>polyPt([[0,-1],[0.5,-0.3],[0.25,-0.3],[0.7,0.2],[0.2,0.2],[0.2,0.9],[-0.2,0.9],[-0.2,0.2],[-0.7,0.2],[-0.25,-0.3],[-0.5,-0.3]],t),
  rocket:t=>polyPt([[0,-1],[0.3,-0.5],[0.3,0.3],[0.6,0.5],[0.3,0.8],[0.2,0.9],[-0.2,0.9],[-0.3,0.8],[-0.6,0.5],[-0.3,0.3],[-0.3,-0.5]],t),
  crown:t=>polyPt([[-1,0.5],[-1,-0.3],[-0.6,0.2],[-0.3,-0.7],[0,0.2],[0.3,-0.7],[0.6,0.2],[1,-0.3],[1,0.5]],t),
  lightning:t=>polyPt([[0.1,-1],[-0.5,-0.1],[0,-0.1],[-0.3,1],[0.5,0],[0,0],[0.4,-1]],t),
  octagon:t=>{const verts=[];for(let k=0;k<8;k++){const ang=(k/8)*2*Math.PI-Math.PI/8;verts.push([Math.cos(ang),Math.sin(ang)]);}return polyPt(verts,t);},
  shield:t=>polyPt([[0,-1],[0.85,-0.8],[0.85,0.2],[0,1],[-0.85,0.2],[-0.85,-0.8]],t),
  moon:t=>polyPt([[0,-1],[0.7,-0.6],[0.85,0],[0.7,0.6],[0,1],[0.35,0.55],[0.45,0],[0.35,-0.55]],t),
  hourglass:t=>polyPt([[-0.8,-1],[0.8,-1],[0.18,0],[0.8,1],[-0.8,1],[-0.18,0]],t),
  clover:t=>{const a=2*Math.PI*t;const r=0.4+0.6*Math.abs(Math.sin(2*a));return{x:r*Math.cos(a),y:r*Math.sin(a)};},
  snowflake:t=>{const verts=[];for(let k=0;k<12;k++){const r=k%2===0?1:0.45;const ang=(k/12)*2*Math.PI-Math.PI/2;verts.push([r*Math.cos(ang),r*Math.sin(ang)]);}return polyPt(verts,t);},
  sun:t=>{const verts=[];for(let k=0;k<16;k++){const r=k%2===0?1:0.65;const ang=(k/16)*2*Math.PI-Math.PI/2;verts.push([r*Math.cos(ang),r*Math.sin(ang)]);}return polyPt(verts,t);},
  anchor:t=>polyPt([[0,-1],[0.25,-1],[0.25,-0.7],[0.6,-0.7],[0.6,-0.5],[0.25,-0.5],[0.25,0.5],[0.85,0.3],[0.65,0.8],[0,1],[-0.65,0.8],[-0.85,0.3],[-0.25,0.5],[-0.25,-0.5],[-0.6,-0.5],[-0.6,-0.7],[-0.25,-0.7],[-0.25,-1]],t),
  sword:t=>polyPt([[0,-1],[0.18,-0.6],[0.18,0.35],[0.65,0.35],[0.65,0.5],[0.18,0.5],[0.18,0.85],[0.28,0.85],[0.28,1],[-0.28,1],[-0.28,0.85],[-0.18,0.85],[-0.18,0.5],[-0.65,0.5],[-0.65,0.35],[-0.18,0.35],[-0.18,-0.6]],t)
};
const SHAPE_ORDER=['circle','triangle','square','diamond','hexagon','heart','star','arrow','house','fish','cat','flower','tree','rocket','crown','lightning','butterfly','octagon','shield','moon','hourglass','clover','snowflake','sun','anchor','sword'];
const SHAPE_MIN_N={circle:5,triangle:6,square:8,diamond:8,hexagon:6,heart:10,star:10,house:10,arrow:7,cat:10,fish:9,butterfly:16,flower:10,tree:11,rocket:11,crown:9,lightning:7,octagon:8,shield:8,moon:8,hourglass:8,clover:12,snowflake:12,sun:12,anchor:12,sword:12};
const SHAPE_LABEL={circle:'Circle ⭕',triangle:'Triangle 🔺',square:'Square ⬛',diamond:'Diamond 💎',hexagon:'Hexagon ⬡',heart:'Heart ❤️',star:'Star ⭐',house:'House 🏠',arrow:'Arrow ➡️',cat:'Cat 🐱',fish:'Fish 🐟',butterfly:'Butterfly 🦋',flower:'Flower 🌸',tree:'Tree 🌳',rocket:'Rocket 🚀',crown:'Crown 👑',lightning:'Lightning ⚡',octagon:'Octagon 🛑',shield:'Shield 🛡️',moon:'Moon 🌙',hourglass:'Hourglass ⌛',clover:'Clover 🍀',snowflake:'Snowflake ❄️',sun:'Sun ☀️',anchor:'Anchor ⚓',sword:'Sword ⚔️'};
function pickShape(lvl){return SHAPE_ORDER[(lvl-1)%SHAPE_ORDER.length];}

function resize(){dpr=window.devicePixelRatio||1;W=window.innerWidth;H=window.innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);resizeConfetti();initBgStars();}
window.addEventListener('resize',()=>{resize();if(nodes.length)draw();});
resize();

function seededRandom(seed){let s=seed;return function(){s=(s*16807)%2147483647;return(s-1)/2147483646;};}

function segIntersect(ax,ay,bx,by,cx,cy,dx,dy){
  const det=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);
  if(Math.abs(det)<1e-10)return false;
  const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/det;
  const u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/det;
  return t>0.01&&t<0.99&&u>0.01&&u<0.99;
}

function getSegIntersectionPt(ax,ay,bx,by,cx,cy,dx,dy){
  const det=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);
  if(Math.abs(det)<1e-10)return null;
  const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/det;
  const u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/det;
  if(t>0.03&&t<0.97&&u>0.03&&u<0.97){
    return {x:ax+t*(bx-ax),y:ay+t*(by-ay)};
  }
  return null;
}

function generateLevelData(lvl){
  const shapeName=pickShape(lvl);
  const shapeFn=SHAPES[shapeName];
  const minN=SHAPE_MIN_N[shapeName]||8;
  const ch=Math.min(20,Math.floor((lvl-1)/50)+1);
  const cycle=((lvl-1)%10);
  const waveBonus=Math.floor(Math.sin((cycle/10)*Math.PI)*2.5);
  const chBaseN=Math.floor(5+(ch-1)*0.65);
  const targetN=chBaseN+waveBonus;
  const n=Math.min(22,Math.max(minN,targetN));
  
  // Daily mode seed logic
  let seed=lvl*7919+12345;
  if(gameMode === 'daily') {
      let d=new Date();
      seed=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()+lvl;
  }
  
  const rng=seededRandom(seed);
  const sCx=200,sCy=350,sScale=100;
  const sPts=[];
  for(let i=0;i<n;i++){const p=shapeFn(i/n);sPts.push({x:sCx+p.x*sScale,y:sCy+p.y*sScale});}

  const edgeDefs=[];
  for(let i=0;i<n;i++)edgeDefs.push([i,(i+1)%n]);
  const edgeSet=new Set(edgeDefs.map(e=>Math.min(e[0],e[1])+'-'+Math.max(e[0],e[1])));

  const extraRatio=0.25+Math.min(0.35,(ch-1)*0.02)+(cycle>=7?0.1:0);
  const targetExtra=Math.min(Math.floor(n*extraRatio)+Math.floor(cycle/3),Math.floor(n*0.85));
  let added=0,attempts=0;
  while(added<targetExtra&&attempts<500){
    const a=Math.floor(rng()*n),b=Math.floor(rng()*n);
    if(a===b){attempts++;continue;}
    const key=Math.min(a,b)+'-'+Math.max(a,b);
    if(edgeSet.has(key)){attempts++;continue;}
    let crosses=false;
    for(const[ea,eb]of edgeDefs){
      if(ea===a||ea===b||eb===a||eb===b)continue;
      if(segIntersect(sPts[a].x,sPts[a].y,sPts[b].x,sPts[b].y,sPts[ea].x,sPts[ea].y,sPts[eb].x,sPts[eb].y)){crosses=true;break;}
    }
    if(!crosses){edgeSet.add(key);edgeDefs.push([a,b]);added++;}
    attempts++;
  }
  return{n,edgeDefs,seed,shapeName,ch};
}

let cachedCrossCount=0,cachedEdgeCrossed=[],cachedCrossingPoints=[],crossingsDirty=true;
function markCrossingsDirty(){crossingsDirty=true;}
function recalcCrossings(){
  if(!crossingsDirty)return;
  crossingsDirty=false;
  cachedCrossCount=0;
  cachedEdgeCrossed=new Array(edges.length).fill(false);
  cachedCrossingPoints=[];
  for(let i=0;i<edges.length;i++){
    const[a1,b1]=edges[i];
    const ax1=nodes[a1].x,ay1=nodes[a1].y,bx1=nodes[b1].x,by1=nodes[b1].y;
    for(let j=i+1;j<edges.length;j++){
      const[a2,b2]=edges[j];
      if(a1===a2||a1===b2||b1===a2||b1===b2)continue;
      if(segIntersect(ax1,ay1,bx1,by1,nodes[a2].x,nodes[a2].y,nodes[b2].x,nodes[b2].y)){
        cachedCrossCount++;
        cachedEdgeCrossed[i]=true;
        cachedEdgeCrossed[j]=true;
        const pt=getSegIntersectionPt(ax1,ay1,bx1,by1,nodes[a2].x,nodes[a2].y,nodes[b2].x,nodes[b2].y);
        if(pt)cachedCrossingPoints.push(pt);
      }
    }
  }
}
function countCrossings(){recalcCrossings();return cachedCrossCount;}
function isEdgeCrossing(ei){recalcCrossings();return cachedEdgeCrossed[ei];}

function buildLevel(lvl){
  const{n,edgeDefs,seed,shapeName,ch}=generateLevelData(lvl);
  const shapeFn=SHAPES[shapeName];
  const rng=seededRandom(seed+1);
  const cx=W/2,cy=H/2;
  const availW=W-100,availH=H-240;
  const scale=Math.min(availW,availH)*0.44;
  const nodeR=Math.max(11,23-n*0.55);
  const pts=[],solvedPos=[];
  
  let fixedProb=0;
  if(gameMode !== 'zen') {
      if(ch >= 13) fixedProb=0.20;
      else if(ch >= 6) fixedProb=0.15;
      else if(ch >= 2) fixedProb=0.10;
  }
  
  for(let i=0;i<n;i++){
    const p=shapeFn(i/n);
    const sx=cx+p.x*scale,sy=cy+p.y*scale;
    solvedPos.push({x:sx,y:sy});
    let isFixed=false;
    if(fixedProb > 0 && rng() < fixedProb) isFixed=true;
    pts.push({x:sx,y:sy,r:nodeR,color:COLORS[i%COLORS.length],id:i,isFixed:isFixed});
  }
  
  const fixedCount=pts.filter(p=>p.isFixed).length;
  const maxFixed=Math.max(1,Math.floor(n*0.3));
  if(fixedCount > maxFixed || fixedCount === n){
      let unfixCount=fixedCount-maxFixed;
      for(let p of pts){
          if(p.isFixed && unfixCount > 0){
              p.isFixed=false;
              unfixCount--;
          }
      }
  }
  
  currentShape=shapeName;
  const edgeList=[],edgeSet=new Set();
  for(const[a,b]of edgeDefs){
    const key=Math.min(a,b)+'-'+Math.max(a,b);
    if(!edgeSet.has(key)&&a<n&&b<n){edgeSet.add(key);edgeList.push([a,b,COLORS[(a+b)%COLORS.length]]);}
  }
  const margin=50,topM=95,botM=115;
  nodes=pts;edges=edgeList;
  let att=0;
  do{for(let i=0;i<pts.length;i++){pts[i].x=margin+rng()*(W-margin*2);pts[i].y=topM+rng()*(H-topM-botM);}att++;}
  while(countCrossings()===0&&att<40);
  if(countCrossings()===0){for(let i=0;i<Math.floor(n/2);i++){const j=n-1-i;[pts[i].x,pts[j].x]=[pts[j].x,pts[i].x];[pts[i].y,pts[j].y]=[pts[j].y,pts[i].y];}}
  return{nodes:pts,edges:edgeList,solvedPositions:solvedPos};
}

function useHint(){
  if(solved)return;
  if(hintsLeft<=0){
    if(window.AndroidBridge){AndroidBridge.requestAdForHint();}
    return;
  }
  initAudio();sndHint();
  let bestNode=-1,bestReduction=-1;const cur=countCrossings();
  for(let i=0;i<nodes.length;i++){
    if(nodes[i].isFixed) continue;
    const ox=nodes[i].x,oy=nodes[i].y;
    nodes[i].x=solvedPositions[i].x;nodes[i].y=solvedPositions[i].y;
    const nc=countCrossings();nodes[i].x=ox;nodes[i].y=oy;
    const red=cur-nc,dist=Math.hypot(ox-solvedPositions[i].x,oy-solvedPositions[i].y);
    if(red>bestReduction||(red===bestReduction&&dist>30)){bestReduction=red;bestNode=i;}
  }
  if(bestNode===-1){
      for(let i=0;i<nodes.length;i++) if(!nodes[i].isFixed) {bestNode=i; break;}
  }
  if(bestNode!==-1){
      hintsLeft--;updateHintUI();animateHint(bestNode);
  }
}

function animateHint(ni){
  const node=nodes[ni],tx=solvedPositions[ni].x,ty=solvedPositions[ni].y;
  const sx=node.x,sy=node.y,dur=500,st=performance.now();hintNode=ni;
  function step(now){
    const t=Math.min(1,(now-st)/dur),e=t<0.5?2*t*t:-1+(4-2*t)*t;
    node.x=sx+(tx-sx)*e;node.y=sy+(ty-sy)*e;markCrossingsDirty();
    if(Math.random()>0.5)spawnParticles(node.x,node.y,node.color,2);
    if(t<1)requestAnimationFrame(step);
    else{hintNode=null;if(gameMode!=='zen') moves++;spawnRingParticles(node.x,node.y,node.color);updateMovesUI();checkWin();}
  }
  requestAnimationFrame(step);
}
function updateHintUI(){
  document.getElementById('hint-count').textContent=hintsLeft>0?'('+hintsLeft+')':'🎬';
  document.getElementById('hint-btn').disabled=false;
}
function grantBonusHint(){hintsLeft++;updateHintUI();initAudio();sndHint();useHint();}
function onAdNotAvailable(){initAudio();playTone(300,0.15,'sawtooth',0.08);}
function updateMovesUI(){
    if(gameMode === 'zen'){
        document.getElementById('moves-badge').textContent = 'Relax';
    } else {
        document.getElementById('moves-badge').textContent='Moves: '+moves;
    }
    document.getElementById('moves-badge').style.animation='none';
    requestAnimationFrame(()=>document.getElementById('moves-badge').style.animation='badgeBump 0.25s ease');
}

function getQuadCP(ax,ay,bx,by,extraSag){const len=Math.hypot(bx-ax,by-ay);const sag=Math.min(len*0.1,26)+(extraSag||0);const bounce=untangleBounce>0?untangleBounce*(1-untangleBounce)*160:0;return{x:(ax+bx)/2,y:(ay+by)/2+sag+bounce};}
function quadBezierPt(ax,ay,cpx,cpy,bx,by,t){const mt=1-t;return{x:mt*mt*ax+2*mt*t*cpx+t*t*bx,y:mt*mt*ay+2*mt*t*cpy+t*t*by};}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBgStars(gameTime);
  drawGameBoardTray();

  const nowMs=performance.now();
  if(nowMs<previewUntil&&solvedPositions.length){
    const remain=(previewUntil-nowMs)/1600;
    const alpha=Math.min(0.9,remain*1.5);
    ctx.save();
    ctx.strokeStyle=`rgba(254,202,87,${0.75*alpha})`;
    ctx.lineWidth=3;ctx.setLineDash([10,6]);
    ctx.beginPath();
    for(let i=0;i<solvedPositions.length;i++){
      const p=solvedPositions[i];
      if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
    }
    ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    for(const p of solvedPositions){
      ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fillStyle=`rgba(254,202,87,${0.8*alpha})`;ctx.fill();
    }
    ctx.restore();
  }

  if(hintNode!==null){
    const sp=solvedPositions[hintNode],t=gameTime*3;
    ctx.beginPath();ctx.arc(sp.x,sp.y,nodes[hintNode].r+10+Math.sin(t)*3,0,Math.PI*2);
    ctx.fillStyle='rgba(254,202,87,0.12)';ctx.fill();
    ctx.beginPath();ctx.arc(sp.x,sp.y,nodes[hintNode].r+10,0,Math.PI*2);
    ctx.strokeStyle='rgba(254,202,87,0.5)';ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
  }

  // Draw all smooth 3D braided threads
  for(let i=0;i<edges.length;i++){
    const[a,b,col]=edges[i];const crossed=isEdgeCrossing(i);const na=nodes[a],nb=nodes[b];
    const sway=Math.sin(gameTime*0.75+i*1.37)*2.5;
    const cp=getQuadCP(na.x,na.y,nb.x,nb.y,sway);
    drawBraidedThread(na,nb,cp,na.color,crossed,i);
  }

  // Draw iconic glowing crossing knot badges (Red ✕ Indicators)
  drawCrossingKnots();

  // Draw 3D Shiny Metallic Pins / Pegs
  for(let ni=0;ni<nodes.length;ni++){
    drawMetallicPin(nodes[ni],ni);
  }

  if(dragNode){
    const pulse=1+Math.sin(gameTime*8)*0.12;
    ctx.beginPath();ctx.arc(dragNode.x,dragNode.y,(dragNode.r+18)*pulse,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(dragNode.x,dragNode.y,dragNode.r+28,0,Math.PI*2);
    ctx.strokeStyle='rgba(102,126,234,0.3)';ctx.lineWidth=2;ctx.stroke();
  }

  drawParticles();
  const c=countCrossings();const badge=document.getElementById('cross-badge');
  badge.textContent='✕ '+c;badge.style.display=c>0?'block':'none';
}

function drawGameBoardTray() {
  const mx = 12;
  const my = 72;
  const bw = W - mx * 2;
  const bh = H - my - 86;
  const br = 26;

  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 12;

  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(mx, my, bw, bh, br);
  else ctx.rect(mx, my, bw, bh);
  const boardGrd = ctx.createLinearGradient(mx, my, mx, my + bh);
  boardGrd.addColorStop(0, '#1c1b3d');
  boardGrd.addColorStop(0.5, '#121028');
  boardGrd.addColorStop(1, '#0e0c20');
  ctx.fillStyle = boardGrd;
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.lineWidth = 2.5;
  ctx.strokeStyle = 'rgba(102, 126, 234, 0.35)';
  ctx.stroke();

  ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
  const step = 34;
  for (let x = mx + 22; x < mx + bw - 16; x += step) {
    for (let y = my + 22; y < my + bh - 16; y += step) {
      ctx.beginPath();
      ctx.arc(x, y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawBraidedThread(na, nb, cp, color, crossed, i) {
  const ropeW = Math.max(12, Math.min(18, na.r * 0.9));

  ctx.save();
  ctx.lineCap = 'round';
  ctx.setLineDash([]);

  // 1. Soft Realistic Drop Shadow
  ctx.beginPath();
  ctx.moveTo(na.x, na.y + 7);
  ctx.quadraticCurveTo(cp.x, cp.y + 8, nb.x, nb.y + 7);
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.48)';
  ctx.lineWidth = ropeW + 5;
  ctx.stroke();

  // 2. Base Outer Edge (gives 3D cylindrical depth)
  ctx.beginPath();
  ctx.moveTo(na.x, na.y);
  ctx.quadraticCurveTo(cp.x, cp.y, nb.x, nb.y);
  ctx.strokeStyle = crossed ? '#800c18' : shadeColor(color, -48);
  ctx.lineWidth = ropeW + 2.5;
  ctx.stroke();

  // 3. Main Colored Body
  const baseCol = crossed ? '#ff3856' : color;
  ctx.beginPath();
  ctx.moveTo(na.x, na.y);
  ctx.quadraticCurveTo(cp.x, cp.y, nb.x, nb.y);
  ctx.strokeStyle = baseCol;
  ctx.lineWidth = ropeW;
  ctx.stroke();

  // 4. Realistic Braided Weave (Tactile ribbed thread texture)
  const len = Math.hypot(nb.x - na.x, nb.y - na.y);
  const steps = Math.max(10, Math.floor(len / 8));
  ctx.lineWidth = 2.4;
  for (let s = 1; s < steps; s++) {
    const t = s / steps;
    const pt = quadBezierPt(na.x, na.y, cp.x, cp.y, nb.x, nb.y, t);
    const mt = 1 - t;
    const dx = 2 * mt * (cp.x - na.x) + 2 * t * (nb.x - cp.x);
    const dy = 2 * mt * (cp.y - na.y) + 2 * t * (nb.y - cp.y);
    const h = Math.hypot(dx, dy) || 1;
    const nx = -dy / h;
    const ny = dx / h;
    const slant = (s % 2 === 0) ? 0.38 : -0.38;
    const vx = nx + (dx / h) * slant;
    const vy = ny + (dy / h) * slant;
    const vh = Math.hypot(vx, vy) || 1;
    const hw = ropeW * 0.42;

    ctx.beginPath();
    ctx.moveTo(pt.x - (vx / vh) * hw, pt.y - (vy / vh) * hw);
    ctx.lineTo(pt.x + (vx / vh) * hw, pt.y + (vy / vh) * hw);
    ctx.strokeStyle = (s % 2 === 0) ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.28)';
    ctx.stroke();
  }

  // 5. Glossy Cylindrical Specular Sheen (Silky thread reflection)
  const edx = nb.x - na.x, edy = nb.y - na.y, elen = Math.hypot(edx, edy) || 1;
  const hx = -edy / elen * (ropeW * 0.22);
  const hy = edx / elen * (ropeW * 0.22);
  ctx.beginPath();
  ctx.moveTo(na.x + hx, na.y + hy);
  ctx.quadraticCurveTo(cp.x + hx, cp.y + hy, nb.x + hx, nb.y + hy);
  ctx.strokeStyle = crossed ? 'rgba(255,220,220,0.5)' : 'rgba(255,255,255,0.48)';
  ctx.lineWidth = Math.max(2, ropeW * 0.25);
  ctx.stroke();

  // 6. Untangled Traveling Light Pulse (Sparkling glide)
  if (!crossed) {
    const pr = (gameTime * 0.45 + i * 0.22) % 1;
    const gp = quadBezierPt(na.x, na.y, cp.x, cp.y, nb.x, nb.y, pr);
    ctx.beginPath();
    ctx.arc(gp.x, gp.y, ropeW * 0.24, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
}

function drawCrossingKnots() {
  if (!cachedCrossingPoints || !cachedCrossingPoints.length) return;
  const pulse = 1 + Math.sin(gameTime * 6) * 0.08;
  const r = 11 * pulse;

  for (const pt of cachedCrossingPoints) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r + 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 56, 86, 0.35)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
    const rad = ctx.createRadialGradient(pt.x - r * 0.3, pt.y - r * 0.3, 1, pt.x, pt.y, r);
    rad.addColorStop(0, '#ff9ff3');
    rad.addColorStop(0.3, '#ff3856');
    rad.addColorStop(1, '#800c18');
    ctx.fillStyle = rad;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    const s = r * 0.42;
    ctx.beginPath();
    ctx.moveTo(pt.x - s, pt.y - s);
    ctx.lineTo(pt.x + s, pt.y + s);
    ctx.moveTo(pt.x + s, pt.y - s);
    ctx.lineTo(pt.x - s, pt.y + s);
    ctx.stroke();
    ctx.restore();
  }
}

function drawMetallicPin(n, ni) {
  const sc = nodeScales[ni] || 1;
  const breathe = 1 + Math.sin(gameTime * 2 + ni * 0.5) * 0.02;
  const s = sc * breathe;
  const nr = n.r * s;

  ctx.save();
  // 1. Base Ellipse Shadow onto the board
  ctx.beginPath();
  ctx.ellipse(n.x, n.y + nr * 0.5, nr * 1.25, nr * 0.55, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fill();

  // 2. Chrome Metallic Ring Base (Socket where pin is drilled)
  ctx.beginPath();
  ctx.arc(n.x, n.y, nr + 6, 0, Math.PI * 2);
  const ringGrd = ctx.createLinearGradient(n.x - nr, n.y - nr, n.x + nr, n.y + nr);
  ringGrd.addColorStop(0, '#2d3436');
  ringGrd.addColorStop(0.35, '#dfe4ea');
  ringGrd.addColorStop(0.65, '#747d8c');
  ringGrd.addColorStop(1, '#1e272e');
  ctx.fillStyle = ringGrd;
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(0,0,0,0.6)';
  ctx.stroke();

  // 3. Shiny Metallic Pin Dome / Knob
  ctx.beginPath();
  ctx.arc(n.x, n.y, nr, 0, Math.PI * 2);
  const domeGrd = ctx.createRadialGradient(n.x - nr * 0.35, n.y - nr * 0.35, 1, n.x, n.y, nr);
  domeGrd.addColorStop(0, '#ffffff');
  domeGrd.addColorStop(0.2, '#f1f2f6');
  domeGrd.addColorStop(0.5, n.color);
  domeGrd.addColorStop(0.85, shadeColor(n.color, -38));
  domeGrd.addColorStop(1, '#1e272e');
  ctx.fillStyle = domeGrd;
  ctx.fill();
  ctx.lineWidth = 1.8;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.stroke();

  // 4. Glossy Specular Hotspot Highlight
  ctx.beginPath();
  ctx.arc(n.x - nr * 0.35, n.y - nr * 0.35, nr * 0.32, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.fill();

  // 5. Soft Rim Bounce Light
  ctx.beginPath();
  ctx.arc(n.x + nr * 0.28, n.y + nr * 0.28, nr * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.fill();

  if (n.isFixed) {
    ctx.beginPath();
    ctx.arc(n.x, n.y, nr * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#d35400';
    ctx.stroke();
    ctx.font = `${Math.floor(nr * 0.75)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚓', n.x, n.y);
  }

  if (equippedSkin !== 'default' && skins[equippedSkin]) {
    ctx.font = `${nr * 1.5}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(skins[equippedSkin].icon, n.x, n.y);
  }

  ctx.restore();
}

function shadeColor(color,p){const num=parseInt(color.replace('#',''),16);const r=Math.min(255,Math.max(0,(num>>16)+p));const g=Math.min(255,Math.max(0,((num>>8)&0xFF)+p));const b=Math.min(255,Math.max(0,(num&0xFF)+p));return'#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);}

function gameLoop(now){
  const dt=(now-lastFrame)/1000;lastFrame=now;gameTime+=dt;
  if(untangleBounce>0)untangleBounce=Math.max(0,untangleBounce-dt*2.5);
  if(dragNode){const lf=1-Math.pow(0.72,dt*60);dragNode.x+=(dragTargetX-dragNode.x)*lf;dragNode.y+=(dragTargetY-dragNode.y)*lf;markCrossingsDirty();}
  
  if(gameMode === 'timeattack' && !solved) {
      timeRemaining -= dt;
      if(timeRemaining <= 0) {
          timeRemaining = 0;
          solved = true; // freeze game
          showGameOver();
      }
      document.getElementById('timer-badge').textContent = '⏳ ' + Math.ceil(timeRemaining) + 's';
  }
  
  updateParticles(dt);updateConfetti();draw();requestAnimationFrame(gameLoop);
}

function getPos(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function findNode(x,y){for(let i=nodes.length-1;i>=0;i--){const dx=x-nodes[i].x,dy=y-nodes[i].y;if(dx*dx+dy*dy<(nodes[i].r+20)**2)return nodes[i];}return null;}
canvas.addEventListener('mousedown',onDown);canvas.addEventListener('mousemove',onMove);canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('touchstart',onDown,{passive:false});canvas.addEventListener('touchmove',onMove,{passive:false});canvas.addEventListener('touchend',onUp);

function onDown(e){e.preventDefault();if(solved)return;initAudio();const p=getPos(e);let n=findNode(p.x,p.y);if(n){if(n.isFixed){hapticVibrate(15);return;} dragNode=n; sndPickup();nodeScales[dragNode.id]=1.2;prevCrossings=countCrossings();dragTargetX=dragNode.x;dragTargetY=dragNode.y;}}
function onMove(e){e.preventDefault();if(!dragNode||solved)return;const p=getPos(e);dragTargetX=Math.max(20,Math.min(W-20,p.x));dragTargetY=Math.max(70,Math.min(H-80,p.y));if(Math.random()>0.8)spawnParticles(dragNode.x,dragNode.y,dragNode.color,1);}
function onUp(e){if(dragNode&&!solved){nodeScales[dragNode.id]=1;sndDrop();if(gameMode!=='zen')moves++;updateMovesUI();checkWin();}dragNode=null;}

function checkWin() {
    const nc=countCrossings();
    if(nc<prevCrossings){sndUncross();spawnRingParticles(dragNode.x,dragNode.y,'#1dd1a1');spawnParticles(dragNode.x,dragNode.y,dragNode.color,12);}
    prevCrossings=nc;
    if(nc===0){solved=true;untangleBounce=1.0;showWin();}
}

function getChapterForLevel(lvl) {
  return Math.min(20, Math.floor((lvl - 1) / 50) + 1);
}

function getChapterInfo(ch) {
  if(ch <= CHAPTERS.length) return CHAPTERS[ch - 1];
  return { id: ch, name: "Endless Legends", icon: "♾️", color: "#e056fd" };
}

function loadLevel(lvl){
  level=lvl;
  if(gameMode === 'classic' && lvl > unlockedLevels) {
      unlockedLevels = lvl;
  }
  saveState();
  const data=buildLevel(lvl);nodes=data.nodes;edges=data.edges;solvedPositions=data.solvedPositions;
  moves=0;solved=false;hintsLeft=2;hintNode=null;markCrossingsDirty();prevCrossings=countCrossings();nodeScales={};particles=[];
  
  if(gameMode === 'daily') {
      document.getElementById('level-badge').textContent='Daily Puzzle';
  } else if(gameMode === 'zen') {
      document.getElementById('level-badge').textContent='Lv '+lvl+' • Zen';
  } else {
      document.getElementById('level-badge').textContent='Lv '+lvl+'/1000+ • '+SHAPE_LABEL[currentShape];
  }
  
  previewUntil=performance.now()+1600;
  document.getElementById('level-badge').style.animation='none';
  requestAnimationFrame(()=>document.getElementById('level-badge').style.animation='badgeBump 0.35s ease');
  
  updateMovesUI();
  document.getElementById('win-screen').classList.remove('show');
  document.getElementById('hint-btn').disabled=(gameMode==='timeattack');
  updateHintUI();
  
  if(gameMode === 'timeattack') {
      timeRemaining = Math.max(30, Math.min(120, 60 + Math.floor(nodes.length * 2.5) - Math.min(25, Math.floor(lvl * 0.05))));
      document.getElementById('timer-badge').style.display = 'block';
  } else {
      document.getElementById('timer-badge').style.display = 'none';
  }
  
  const cx=W/2,cy=H/2;
  nodes.forEach((n,i)=>{const tx=n.x,ty=n.y;n.x=cx;n.y=cy;const delay=i*40,st=performance.now()+delay;
    function anim(now){const t=Math.min(1,(now-st)/400);if(t<0){requestAnimationFrame(anim);return;}const e=1-Math.pow(1-t,3);n.x=cx+(tx-cx)*e;n.y=cy+(ty-cy)*e;if(t<1)requestAnimationFrame(anim);}
    requestAnimationFrame(anim);});
}

function resetLevel(){initAudio();sndReset();loadLevel(level);}
function skipLevel(){initAudio();sndClick();level++;loadLevel(level);}
function nextLevel(){
  initAudio();sndClick();
  if(gameMode === 'daily' || gameMode === 'timeattack') { goHome(); return; }
  level++;
  if(level>1&&(level-1)%3===0&&window.AndroidBridge){AndroidBridge.showInterstitial();}
  loadLevel(level);
}

function showGameOver() {
  sndReset();
  document.getElementById('win-title').textContent = 'Time Up!';
  document.getElementById('win-msg').textContent = 'You ran out of time!';
  document.getElementById('stars-row').style.display = 'none';
  document.getElementById('next-lvl-btn').style.display = 'none';
  document.getElementById('retry-btn').style.display = 'inline-block';
  const chapterBanner = document.getElementById('win-chapter-banner');
  if(chapterBanner) chapterBanner.style.display = 'none';
  document.getElementById('win-screen').classList.add('show');
}

function showWin(){
  sndWin();launchConfetti();
  document.getElementById('win-title').textContent = 'Untangled!';
  document.getElementById('win-msg').textContent = 'Level ' + level + ' / 1000+ Solved • ' + (gameMode==='zen'?'Relaxed':moves+' moves');
  document.getElementById('stars-row').style.display = 'flex';
  document.getElementById('next-lvl-btn').style.display = 'inline-block';
  document.getElementById('retry-btn').style.display = 'none';
  
  const chapterBanner = document.getElementById('win-chapter-banner');
  if(chapterBanner) {
    if(level % 50 === 0) {
      chapterBanner.style.display = 'block';
      chapterBanner.textContent = `🎉 Chapter ${level/50} Mastered! Next Chapter Unlocked!`;
    } else {
      chapterBanner.style.display = 'none';
    }
  }
  
  if(gameMode === 'daily') document.getElementById('next-lvl-btn').textContent = 'Finish';
  else document.getElementById('next-lvl-btn').textContent = 'Next Level ▶';
  
  const stars=document.querySelectorAll('#stars-row .star');const n=nodes.length,t1=n*3,t2=n*2;
  stars.forEach(s=>{s.style.opacity='0';s.style.transform='scale(0)';s.style.animation='none';});
  nodes.forEach(nd=>spawnParticles(nd.x,nd.y,nd.color,6));
  
  let earned = 0;
  if(gameMode !== 'zen') {
      earned = moves<=t2?3:moves<=t1?2:1;
      const prevEarned = levelStars[level] || 0;
      if(earned > prevEarned) {
          totalStars += (earned - prevEarned);
          levelStars[level] = earned;
      }
      if(gameMode === 'classic' && level >= unlockedLevels) {
          unlockedLevels = level + 1;
      }
      saveState();
  }
  
  setTimeout(()=>{document.getElementById('win-screen').classList.add('show');
    requestAnimationFrame(()=>{
        stars.forEach((s,i)=>{
            if(gameMode === 'zen') { s.style.display='none'; }
            else if(i<earned){ s.style.display='inline-block'; s.style.animation=`pop 0.4s ${i*0.15}s ease-out forwards`; }
            else { s.style.display='inline-block'; s.style.opacity='0.2'; s.style.transform='scale(1)'; }
        });
    });},500);
}

function startGame(mode){
    initAudio();sndClick();
    document.getElementById('start-screen').classList.remove('show');
    gameMode = mode;
    if(mode === 'daily') loadLevel(10);
    else loadLevel(unlockedLevels);
}

function goHome() {
    initAudio();sndClick();
    document.getElementById('win-screen').classList.remove('show');
    document.getElementById('start-screen').classList.add('show');
}

// ==================== SHOP & LEVELS UI ====================
function openShop() {
    initAudio();sndClick();
    let grid = document.getElementById('shop-grid');
    grid.innerHTML = '';
    for(let k in skins) {
        let sk = skins[k];
        let div = document.createElement('div');
        div.className = 'shop-item' + (sk.owned ? ' owned' : '') + (equippedSkin === k ? ' equipped' : '');
        div.innerHTML = `<div class="shop-icon">${sk.icon}</div><div>${sk.owned ? 'Select' : '⭐ '+sk.price}</div>`;
        div.onclick = () => buyOrEquipSkin(k);
        grid.appendChild(div);
    }
    document.getElementById('shop-screen').classList.add('show');
}
function closeShop() { initAudio();sndClick(); document.getElementById('shop-screen').classList.remove('show'); }

function buyOrEquipSkin(k) {
    initAudio();sndClick();
    if(skins[k].owned) {
        equippedSkin = k;
        saveState();
        openShop();
        if(nodes.length) draw();
    } else if(totalStars >= skins[k].price) {
        totalStars -= skins[k].price;
        skins[k].owned = true;
        equippedSkin = k;
        saveState();
        sndWin(); // Celebrate purchase
        openShop();
    } else {
        sndReset(); // Cannot afford
    }
}

function openLevels() {
    initAudio(); sndClick();
    currentChapterView = getChapterForLevel(unlockedLevels);
    renderChapterView();
    document.getElementById('levels-screen').classList.add('show');
}

function changeChapter(delta) {
    initAudio(); sndClick();
    const maxCh = Math.max(20, Math.ceil(unlockedLevels / 50));
    currentChapterView = Math.max(1, Math.min(maxCh, currentChapterView + delta));
    renderChapterView();
}

function jumpToCurrentLevel() {
    initAudio(); sndClick();
    currentChapterView = getChapterForLevel(unlockedLevels);
    renderChapterView();
}

function renderChapterView() {
    const ch = currentChapterView;
    const chInfo = getChapterInfo(ch);
    const startLvl = (ch - 1) * 50 + 1;
    const endLvl = ch * 50;
    
    let chEarnedStars = 0;
    for(let i = startLvl; i <= endLvl; i++) {
        if(levelStars[i]) chEarnedStars += levelStars[i];
    }
    
    document.getElementById('chapter-title').textContent = `${chInfo.icon} Chapter ${ch}: ${chInfo.name}`;
    document.getElementById('chapter-sub').textContent = `Levels ${startLvl} - ${endLvl} • ⭐ ${chEarnedStars} / 150`;
    document.getElementById('levels-total-stars').textContent = `⭐ ${totalStars}`;
    document.getElementById('levels-progress-txt').textContent = `Level ${unlockedLevels} / 1000+`;
    
    const maxCh = Math.max(20, Math.ceil(unlockedLevels / 50));
    document.getElementById('prev-chapter-btn').style.opacity = ch > 1 ? '1' : '0.3';
    document.getElementById('next-chapter-btn').style.opacity = ch < maxCh ? '1' : '0.3';
    
    const grid = document.getElementById('level-grid');
    grid.innerHTML = '';
    
    for(let i = startLvl; i <= endLvl; i++) {
        const div = document.createElement('div');
        const locked = i > unlockedLevels;
        const isCurrent = i === unlockedLevels;
        const stars = levelStars[i] || 0;
        const isCompleted = i < unlockedLevels || stars > 0;
        
        div.className = 'level-item' + 
            (locked ? ' locked' : '') + 
            (isCompleted ? ' completed' : '') + 
            (isCurrent ? ' current' : '');
            
        let starStr = '';
        if(stars > 0) {
            starStr = '⭐'.repeat(stars);
        } else if(isCompleted) {
            starStr = '✔️';
        } else if(locked) {
            starStr = '🔒';
        } else {
            starStr = ' ';
        }
        
        div.innerHTML = `<span class="lvl-num">${i}</span><span class="lvl-stars">${starStr}</span>`;
        
        if(!locked) {
            div.onclick = () => {
                closeLevels();
                document.getElementById('start-screen').classList.remove('show');
                gameMode = 'classic';
                loadLevel(i);
            };
        }
        grid.appendChild(div);
    }
}

function closeLevels() { initAudio(); sndClick(); document.getElementById('levels-screen').classList.remove('show'); }

loadState();
lastFrame=performance.now();requestAnimationFrame(gameLoop);
</script>
